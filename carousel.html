<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500;600&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/invite.css">
<style>
html,body{margin:0;background:#F3EEE9}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#F3EEE9;color:#2A1D2B;font-family:Jost,sans-serif}
.slide.dark{background:#1E1520;color:#F4ECF1}
.top{position:absolute;left:80px;right:80px;top:84px}
.eyebrow2{font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:#9C7A3C;font-weight:500}
.dark .eyebrow2{color:#D6B57A}
.h{font-family:'Bodoni Moda',serif;font-weight:500;font-size:96px;line-height:1.02;margin-top:22px;letter-spacing:-.01em}
.h em{font-family:'Pinyon Script',cursive;font-style:normal;font-weight:400;color:#7A3E5C;font-size:1.12em}
.dark .h em{color:#D9A3BF}
.sub{font-size:30px;line-height:1.45;color:#6E6070;margin-top:20px;max-width:820px}
.dark .sub{color:#B9A9B6}
.foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#6E6070}
.dark .foot{color:#B9A9B6}
.brand{font-family:'Bodoni Moda',serif;font-size:30px;color:#2A1D2B}
.brand i{font-family:'Pinyon Script',cursive;font-style:normal;color:#7A3E5C;font-size:36px;margin-left:6px}
.dark .brand{color:#F4ECF1}.dark .brand i{color:#D9A3BF}
.ph{position:absolute;width:430px;height:860px;border-radius:62px;padding:15px;background:#120D14;box-shadow:0 60px 120px -40px rgba(40,10,40,.55)}
.ph .screen{height:100%;border-radius:48px;overflow:hidden}
.ph::after{content:"";position:absolute;top:30px;left:50%;width:112px;height:30px;margin-left:-56px;border-radius:20px;background:#120D14;z-index:5}
.ph .sheet canvas.art{height:330px}
.ph .mus{display:none}
.num{font-family:'Bodoni Moda',serif;font-style:italic;font-size:30px}
.pill{display:inline-block;border:2px solid currentColor;border-radius:999px;padding:10px 26px;font-size:26px}
.bigprice{font-family:'Bodoni Moda',serif;font-size:150px;line-height:1}
.bigprice s{font-size:60px;color:#9a8a98;margin-left:18px}
.seal2{width:260px;height:260px;border-radius:50%;margin:0 auto;display:grid;place-items:center;color:rgba(255,236,244,.92);font-family:'Pinyon Script',cursive;font-size:110px;background:radial-gradient(circle at 35% 30%,#B05A72,#7A3E5C 55%,#4E2239);box-shadow:0 20px 40px rgba(0,0,0,.35),0 0 0 14px rgba(40,10,25,.25) inset}
</style></head>
<body><div id="root"></div>
<script type="module">
import { renderInvite, withDefaults } from "./assets/invite.js";
import { THEMES, draw } from "./assets/themes.js";
const q = new URLSearchParams(location.search), s = q.get("s");
const root = document.getElementById("root");
function phone(theme, style, opts = {}) {
  const { opened = true, rot = 0, sel = null, off = 0, scale = .86 } = opts;
  const wrap = document.createElement("div"); wrap.className = "ph"; wrap.style.cssText = style + `;transform:rotate(${rot}deg) scale(${scale});transform-origin:top center`;
  wrap.innerHTML = `<div class="screen"><div class="i"></div></div>`;
  const el = wrap.querySelector(".i");
  setTimeout(() => {
    renderInvite(el, withDefaults({ theme, music: false, petals: false }), { plan: null });
    if (opened) { el.classList.add("opened"); el.querySelectorAll("canvas[data-motif]").forEach(c => draw(c, c.dataset.motif)); }
    if (sel) setTimeout(() => { const t = el.querySelector(sel); if (t) el.style.transform = `translateY(${-(t.getBoundingClientRect().top - el.getBoundingClientRect().top + off)}px)`; }, 300);
  }, 0);
  return wrap;
}
const slide = document.createElement("div"); slide.className = "slide"; root.appendChild(slide);
const foot = (n) => `<div class="foot"><span class="brand">Velune<i>Letters</i></span><span>${n || "@lettersbyvelune"}</span></div>`;
const top = (k, h, sub) => `<div class="top"><div class="eyebrow2">${k}</div><div class="h">${h}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
const S = {
  // ---------- carousel: how it works ----------
  "how-1"() { slide.innerHTML = top("Digital wedding invitations", "Your invitation<br>in <em>three steps.</em>", "No printing, no postage, no chasing RSVPs. Swipe →") + foot();
    slide.appendChild(phone("mocha", "left:60px;top:540px", { rot: -7, scale: .76 })); slide.appendChild(phone("linen", "left:590px;top:540px", { rot: 7, scale: .76 })); slide.appendChild(phone("heirloom", "left:325px;top:470px", { opened: false })); },
  "how-2"() { slide.innerHTML = top("<span class='num'>1</span> &nbsp;Choose", "Pick one of<br><em>twelve designs.</em>", "Painted florals, lace and wax seals. Every one opens like a real letter.") + foot();
    slide.appendChild(phone("peony", "left:70px;top:560px", { rot: -6, scale: .76 })); slide.appendChild(phone("bordeaux", "left:600px;top:560px", { rot: 6, scale: .76 })); slide.appendChild(phone("midnight", "left:325px;top:520px", {})); },
  "how-3"() { slide.innerHTML = top("<span class='num'>2</span> &nbsp;Personalise", "Add your <em>story.</em>", "Names, date, the day's schedule, venue, dress code, gifts and photos. Ready in about ten minutes.") + foot();
    slide.appendChild(phone("heirloom", "left:325px;top:470px", { sel: ".vtl", off: -10 })); },
  "how-4"() { slide.innerHTML = top("<span class='num'>3</span> &nbsp;Send", "One link,<br>every <em>guest.</em>", "Share it by WhatsApp, SMS or email. Each guest can get a personal link with their name.") + foot();
    slide.appendChild(phone("tuscany", "left:325px;top:520px", { opened: false })); },
  "how-5"() { slide.innerHTML = top("Then relax", "RSVPs arrive<br><em>on their own.</em>", "Guests reply in the invitation. You see who's coming, dietary notes and the head count, all in one place.") + foot();
    slide.appendChild(phone("bordeaux", "left:325px;top:520px", { sel: ".rsvp", off: -30 })); },
  cta() { slide.classList.add("dark");
    slide.innerHTML = `<div class="top" style="text-align:center;top:150px"><div class="seal2">VL</div><div class="h" style="margin-top:70px">Comment <span style="font-style:italic;color:#D9A3BF">LINK</span></div><div class="sub" style="margin:24px auto 0">and we'll send you a live invitation to open on your phone.</div>
    <div style="margin-top:90px" class="eyebrow2">Launch offer · first 20 couples</div><div class="bigprice" style="margin-top:20px">€79<s>€149</s></div>
    <div class="sub" style="margin:26px auto 0">Signature: all 12 languages, music, photo gallery and RSVP. Essential from €69.</div></div>${foot("@lettersbyvelune · link in bio")}`; },
  // ---------- carousel: paper vs velune ----------
  "vs-1"() { slide.innerHTML = top("Before you order paper", "Paper invitations<br>vs <em>Velune Letters.</em>", "An honest comparison for a 100-guest wedding. Swipe →") + foot();
    slide.appendChild(phone("heirloom", "left:325px;top:520px", { opened: false })); },
  "vs-2"() {
    const rows = [["Cost", "Printing and postage, often hundreds of euros", "From €69, once"], ["Delivery", "Days to weeks by post", "Instantly, by link"], ["RSVPs", "You chase replies by phone", "Collected for you"], ["Changes", "Reprint and resend", "Edit any time"], ["Languages", "One per print run", "12, chosen by each guest"], ["The moment", "Opened at the mailbox", "A wax seal, petals and music"]];
    slide.innerHTML = top("Side by side", "The <em>difference.</em>") + `<div style="position:absolute;left:80px;right:80px;top:400px;font-size:29px">
      <div style="display:grid;grid-template-columns:1fr 1.25fr 1.25fr;gap:0;border-top:2px solid #2A1D2B">
      <div></div><div style="padding:22px 10px;font-size:22px;letter-spacing:.24em;text-transform:uppercase;color:#9a8a98">Paper</div><div style="padding:22px 10px;font-size:22px;letter-spacing:.24em;text-transform:uppercase;color:#9C7A3C">Velune</div>
      ${rows.map(r => `<div style="padding:22px 10px;border-top:1px solid #DCCFD6;font-family:'Bodoni Moda',serif;font-size:30px">${r[0]}</div><div style="padding:22px 10px;border-top:1px solid #DCCFD6;color:#8a7a88;line-height:1.3">${r[1]}</div><div style="padding:22px 10px;border-top:1px solid #DCCFD6;line-height:1.3;color:#2A1D2B">${r[2]}</div>`).join("")}
      </div></div>` + foot(); },
  "vs-3"() { slide.innerHTML = top("What your guests see", "A letter that<br><em>opens itself.</em>", "Tap the seal: it melts into a flower, the envelope opens and the invitation glides out.") + foot();
    slide.appendChild(phone("bordeaux", "left:325px;top:520px", { opened: false })); },
  "vs-4"() { slide.innerHTML = top("What you see", "Every detail<br>in <em>one place.</em>", "Countdown, schedule, venue map, dress-code colours and gift notes. Your guests stop asking the same questions.") + foot();
    slide.appendChild(phone("linen", "left:325px;top:520px", { sel: ".vsw", off: -260 })); },
};
S[s]();
const k = Math.min(innerWidth / 1080, innerHeight / 1350);
document.body.style.cssText = "margin:0;overflow:hidden;height:100vh;display:grid;place-items:center;background:" + (slide.classList.contains("dark") ? "#1E1520" : "#F3EEE9");
root.style.cssText = `width:${1080 * k}px;height:${1350 * k}px`; slide.style.transform = `scale(${k})`; slide.style.transformOrigin = "0 0";
document.fonts.ready.then(() => setTimeout(() => { document.body.dataset.ready = "1"; }, 1200));
</script></body></html>

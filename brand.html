<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500;600&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/invite.css">
<style>
html,body{margin:0;background:#F3EEE9}
.slide{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#F3EEE9;color:#2A1D2B;font-family:Jost,sans-serif}
.slide.dark{background:#1E1520;color:#F4ECF1}
.top{position:absolute;left:80px;right:80px;top:84px}
.eyebrow2{font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:#9C7A3C;font-weight:500}
.dark .eyebrow2{color:#D6B57A}
.h{font-family:'Bodoni Moda',serif;font-weight:500;font-size:96px;line-height:1.02;margin-top:22px;letter-spacing:-.01em}
.h em{font-family:'Pinyon Script',cursive;font-style:normal;font-weight:400;color:#7A3E5C;font-size:1.12em}
.dark .h em{color:#D9A3BF}
.sub{font-size:30px;line-height:1.45;color:#6E6070;margin-top:20px;max-width:820px}
.dark .sub{color:#B9A9B6}
.foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#6E6070}
.dark .foot{color:#B9A9B6}
.brand{font-family:'Bodoni Moda',serif;font-size:30px;color:#2A1D2B}
.brand i{font-family:'Pinyon Script',cursive;font-style:normal;color:#7A3E5C;font-size:36px;margin-left:6px}
.dark .brand{color:#F4ECF1}.dark .brand i{color:#D9A3BF}
.ph{position:absolute;width:430px;height:860px;border-radius:62px;padding:15px;background:#120D14;box-shadow:0 60px 120px -40px rgba(40,10,40,.55)}
.ph .screen{height:100%;border-radius:48px;overflow:hidden}
.ph::after{content:"";position:absolute;top:30px;left:50%;width:112px;height:30px;margin-left:-56px;border-radius:20px;background:#120D14;z-index:5}
.ph .sheet canvas.art{height:330px}
.ph .mus{display:none}
.num{font-family:'Bodoni Moda',serif;font-style:italic;font-size:30px}
.pill{display:inline-block;border:2px solid currentColor;border-radius:999px;padding:10px 26px;font-size:26px}
.bigprice{font-family:'Bodoni Moda',serif;font-size:150px;line-height:1}
.bigprice s{font-size:60px;color:#9a8a98;margin-left:18px}
.seal2{width:260px;height:260px;border-radius:50%;margin:0 auto;display:grid;place-items:center;color:rgba(255,236,244,.92);font-family:'Pinyon Script',cursive;font-size:110px;background:radial-gradient(circle at 35% 30%,#B05A72,#7A3E5C 55%,#4E2239);box-shadow:0 20px 40px rgba(0,0,0,.35),0 0 0 14px rgba(40,10,25,.25) inset}
</style></head>
<body><div id="root"></div>
<script type="module">
import { renderInvite, withDefaults } from "./assets/invite.js";
import { THEMES, draw } from "./assets/themes.js";
import * as K from "./assets/stickers.js";
const q = new URLSearchParams(location.search), s = q.get("s");
const root = document.getElementById("root");
const tex = getComputedStyle(document.documentElement).getPropertyValue("--tex");
function phone(theme, style, opts = {}) {
  const { opened = true, rot = 0, sel = null, off = 0, scale = .86 } = opts;
  const wrap = document.createElement("div"); wrap.className = "ph"; wrap.style.cssText = style + `;transform:rotate(${rot}deg) scale(${scale});transform-origin:top center`;
  wrap.innerHTML = `<div class="screen"><div class="i"></div></div>`;
  const el = wrap.querySelector(".i");
  setTimeout(() => {
    renderInvite(el, withDefaults({ theme, music: false, petals: false }), { plan: null });
    if (opened) { el.classList.add("opened"); el.querySelectorAll("canvas[data-motif]").forEach(c => draw(c, c.dataset.motif)); }
    if (sel) setTimeout(() => { const t = el.querySelector(sel); if (t) el.style.transform = `translateY(${-(t.getBoundingClientRect().top - el.getBoundingClientRect().top + off)}px)`; }, 300);
  }, 0);
  return wrap;
}
const slide = document.createElement("div"); slide.className = "slide inv"; root.appendChild(slide);
const paperBg = (c) => `background:${c} var(--tex) 0 0/420px;background-blend-mode:multiply`;
const put = (html, css) => { const d = document.createElement("div"); d.style.cssText = "position:absolute;" + css; d.innerHTML = html; d.querySelectorAll("img").forEach(i => i.style.width = "100%"); slide.appendChild(d); return d; };
const sealSVG = (size, col = "#6E1F2C") => `<svg viewBox="-24 -24 288 288" width="${size}" height="${size}"><defs><radialGradient id="wx" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="color-mix(in srgb, ${col} 70%, #fff)"/><stop offset=".5" stop-color="${col}"/><stop offset="1" stop-color="color-mix(in srgb, ${col} 55%, #000)"/></radialGradient><linearGradient id="gd" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#8C6A33"/><stop offset=".35" stop-color="#F2E2BB"/><stop offset=".6" stop-color="#B8924F"/><stop offset="1" stop-color="#E9D4A1"/></linearGradient><filter id="ds"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a0d12" flood-opacity=".45"/></filter></defs>
  <g filter="url(#ds)"><path d="M120 8c22 2 30 14 48 20s34 2 44 22-6 30-2 50 22 30 12 50-30 16-42 30-12 36-36 40-34-12-54-14-36 12-54-2-6-36-16-52-30-24-22-46 30-16 40-32 6-38 26-46 34 0 56-20z" fill="url(#wx)"/></g>
  <circle cx="120" cy="120" r="78" fill="none" stroke="color-mix(in srgb, ${col} 60%, #000)" stroke-width="5" opacity=".45"/><circle cx="120" cy="120" r="74" fill="none" stroke="url(#gd)" stroke-width="2"/>
  <text x="122" y="150" text-anchor="middle" font-family="Pinyon Script" font-size="96" fill="color-mix(in srgb, ${col} 50%, #000)" opacity=".5">VL</text>
  <text x="120" y="147" text-anchor="middle" font-family="Pinyon Script" font-size="96" fill="url(#gd)">VL</text></svg>`;
const S = {
  avatar() {
    document.documentElement.style.cssText = "--w:1080px;--h:1080px";
    slide.style.cssText = paperBg("#EFE6D6");
    put(K.sprig("#7d8f6a", "#f4ece0", 4), "width:330px;left:120px;top:230px;transform:rotate(-38deg)");
    put(K.sprig("#7d8f6a", "#f4ece0", 9), "width:330px;right:120px;top:250px;transform:rotate(38deg) scaleX(-1)");
    put(sealSVG(800), "left:140px;top:140px");
  },
  cover() {
    document.documentElement.style.cssText = "--w:1640px;--h:624px";
    slide.style.cssText = paperBg("#EDE3D2");
    slide.insertAdjacentHTML("beforeend", `<div style="position:absolute;left:300px;top:118px;width:640px">
      <div class="eyebrow2" style="color:#8C6A33">Velune Letters</div>
      <div class="h" style="font-size:62px;margin-top:16px;color:#2A1D22;line-height:1.04">Invitations your guests<br><em style="color:#6E1F2C">open like a letter.</em></div>
      <div class="sub" style="font-size:25px;margin-top:22px;color:#5d4e48">Wax seal · RSVP · countdown · 12 languages<br>From €69 · Signature €79 launch price</div></div>`);
    slide.appendChild(phone("bordeaux", "left:930px;top:84px", { rot: -9, scale: .6 }));
    slide.appendChild(phone("linen", "left:1130px;top:70px", { rot: 8, scale: .6, sel: ".vpost", off: -20 }));
    slide.appendChild(phone("heirloom", "left:1030px;top:34px", { scale: .64 }));
    put(K.tape("#d9c9a6", 150), "width:140px;left:1112px;top:22px;transform:rotate(-4deg);z-index:5");
    put(K.stamp("#EDE3D2", "#6E1F2C", "VELUNE", "1st"), "width:118px;left:80px;top:90px;transform:rotate(-8deg)");
    put(K.postmark("#5a3a3a", "Velune Letters", "Est · MMXXVI"), "width:190px;left:120px;top:190px;transform:rotate(-14deg);mix-blend-mode:multiply");
    put(K.sprig("#7d8f6a", "#f4ece0", 6), "width:160px;left:60px;top:330px;transform:rotate(-20deg)");
    put(K.watch("16:00"), "width:120px;left:1420px;top:330px;transform:rotate(14deg)");
    put(K.sprig("#7d8f6a", "#f4ece0", 2), "width:140px;left:1450px;top:20px;transform:rotate(25deg)");
    put(K.brooch(), "width:80px;left:860px;top:500px");
  },
  hl() {
    document.documentElement.style.cssText = "--w:1080px;--h:1920px";
    const [label, art] = [q.get("t"), q.get("a")];
    slide.style.cssText = paperBg("#EFE6D6");
    const A = { designs: K.stamp("#EFE6D6", "#6E1F2C", "VELUNE", "12"), how: K.envelope("#E7D9C3", "#6E1F2C"), price: K.tag("#F2E8D6", "#4a3a28", "from €69"), faq: K.watch("16:00"), rsvp: K.rings() }[art];
    put(A, "width:560px;left:260px;top:560px");
    slide.insertAdjacentHTML("beforeend", `<div style="position:absolute;left:0;right:0;top:1260px;text-align:center;font-family:'Pinyon Script';font-size:120px;color:#4a3a28">${label}</div>`);
  },
};
S[s]();
if (q.get("fit")) { const W = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--w")), H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--h")); const k = Math.min(innerWidth / W, innerHeight / H); document.body.style.cssText = `margin:0;overflow:hidden;height:100vh;display:grid;place-items:center;background:#EDE3D2`; root.style.cssText = `width:${W * k}px;height:${H * k}px`; slide.style.transform = `scale(${k})`; slide.style.transformOrigin = "0 0"; }
document.fonts.ready.then(() => setTimeout(() => { document.body.dataset.ready = "1"; }, 1500));
</script></body></html>
